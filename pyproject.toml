[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-desk"
version = "0.2.0"
description = "Multi-model pump.fun trading pipeline: four LLMs vote, a fifth cross-examines."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "zostaff" }]
keywords = ["solana", "pump.fun", "llm", "multi-model", "consensus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "Pillow>=10.0",
    # One SDK per seat on the panel. Grok is reached over plain HTTP because its
    # server-side search tools are not exposed through an OpenAI-compatible client.
    "anthropic>=0.40",
    "openai>=1.50",
    # google-generativeai is end-of-life; google-genai is its supported successor and
    # is natively async, which removes a thread hop from the vision call.
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
trading-desk = "trading_desk.cli:main"

[project.urls]
Repository = "https://github.com/zostaff/grok-claude-gpt-gemini-trading-desk"
Issues = "https://github.com/zostaff/grok-claude-gpt-gemini-trading-desk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

[tool.hatch.build.targets.wheel.force-include]
# PEP 561: without this marker a consumer's type checker ignores our annotations.
"src/trading_desk/py.typed" = "trading_desk/py.typed"

# --- tests -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = [
    "contract: asserts an adapter satisfies the port it claims to implement",
]

# --- lint --------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "D",        # docstrings -- every public callable explains itself
    "ASYNC",    # async correctness
]
ignore = [
    "D203",     # incompatible with D211
    "D213",     # incompatible with D212
    "B008",     # FastAPI-style default calls; not relevant here
    # __init__ signatures are documented by their class docstring, which is where a
    # reader looks for what the object is for. A second docstring restating the
    # parameters would be duplication, not documentation.
    "D107",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles are described by their class docstring; per-method docstrings on a
# fake's four one-line port methods would be noise, not documentation.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105"]

[tool.ruff.lint.isort]
# `tests` is part of this project, not a third-party package.
known-first-party = ["trading_desk", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src/trading_desk"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# These SDKs ship partial or absent stubs; the boundary is covered by contract tests.
module = ["google.genai.*", "google.*", "websockets.*"]
ignore_missing_imports = true
